[package]
name = "catherine-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Catherine's wasm boundary: JSON in/out wasm-bindgen exports over the kernel — no logic of its own"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
catherine-core = { path = "../catherine-core" }
catherine-analysis = { path = "../catherine-analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
