[package]
name = "catherine-ledger"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The P6 kata validation ledger: content-addressed entries, validator, project rollup (openspec change add-kata-validation-ledger, beads catherine-9vv)"

[dependencies]
catherine-core = { path = "../catherine-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "ledger-record"
path = "src/bin/ledger_record.rs"

[[bin]]
name = "ledger-check"
path = "src/bin/ledger_check.rs"
