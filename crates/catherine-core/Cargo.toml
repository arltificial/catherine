[package]
name = "catherine-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Catherine kernel: .ct.json model document format, parser, canonical form, hash"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
proptest = "1"
