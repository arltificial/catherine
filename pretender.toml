[pretender]
mode = "gate"
languages = ["auto"]
# The Verus lane is excluded for the same reason lean/ is: external-checker
# source outside the Cargo build (design Decision 2) — vendored upstream
# guide examples and proof units the 400-line cap cannot hold (a Verus
# proof unit is single-file by construction). The shipped workspace the
# gate protects is untouched.
exclude = ["**/vendor/**", "**/node_modules/**", "**/book/**", "**/web/pkg/**", "**/lean/**", "**/target/**", "**/app.js", "**/*_generated.*", "**/catherine-verus/**", "**/probe-seed/**", "**/prototype/**"]

# Explicit pin of the gate bar this repo was actually enforcing until
# 2026-11-25: the local pretender binary predated pretender-4ti (86a91a7,
# Nov 4: app function_lines 40 -> 30, plus checks that were off: unwraps,
# mock_count, mut_ratio, bool_cluster, void_mutators, lazy_cluster,
# inheritance_depth), and the params rule did not exist in its rule table.
# The v0.12.0 install on 2026-11-25 enforced those defaults for the first
# time, surfacing ~500 standing findings and deadlocking the fail-closed
# gate. This pin restores the previously enforced bar so the gate is green
# while beads epic catherine-hkk walks the tree to the 0.12 defaults:
# each commented OFF line re-enables when its slice of findings is fixed.
[thresholds]
# app role (flattened). Unchanged defaults omitted (cyclomatic 10,
# cognitive 15, file_lines 400, nesting 3, abc 30, duplication 5%).
function_lines_max = 40
# No disable switch exists for base limits; the prior scanner never
# enforced params, so park it high instead of a bare 0 (0 flags every
# unit). Re-tighten to 4 with the epic.
params_max = 100
# Checks: 0 disables (documented semantics). All were off before 86a91a7.
void_mutators_max = 0
mut_ratio_max = 0.0
unwrap_max = 0
bool_cluster_max = 0
inheritance_depth_max = 0
excessive_fields_max = 0

[thresholds.test]
# Classic limits unchanged (cyclomatic 3, function_lines 80, nesting 2,
# cognitive 5, duplication 30%, min_assertions 1).
params_max = 100
mock_count_max = 0
void_mutators_max = 0
unwrap_max = 0
lazy_cluster_min = 0
excessive_fields_max = 0

[roles.test]
paths = ["tests/**", "**/*_test.*", "spec/**"]

[roles.library]
paths = ["pkg/**", "lib/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]

[roles.generated]
paths = ["**/*.pb.go", "**/*_generated.*"]

[roles.vendor]
paths = ["vendor/**", "node_modules/**"]
