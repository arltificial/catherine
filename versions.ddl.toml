# Pinned ecosystem tool versions for this repo's CI and dev setup.
# Standardization §4: installs are pinned, never `latest` — a broken release
# of any tool must not break CI of the whole fleet.
# Update deliberately; the conformance test
# (crates/catherine-cli/tests/standard_conformance.rs) requires this file to
# exist.
#
# §4 matrix row (ddl): pretender ✅ · wai ✅ · bd ✅ · openspec ✅ · dont ✅
# CI installs these pinned — .github/workflows/ci.yml calls
# scripts/ci-install.sh, which reads the pins below.

[tools]
wai = "2026.10.19"      # crates.io: wai-cli — realigned to installed (drift from 2026.10.10)
pretender = "0.10.0"       # crates.io — realigned to installed; --diff-only/--mode gate flags verified against 0.10.0 help (gate is fail-closed without pretender-baseline.json)
dont = "0.2.2"             # crates.io: dont-cli
dulce-de-leche = "0.9.0"   # crates.io (bin: ddl) — self
openspec = "1.15.0"        # npm: @fission-ai/openspec — realigned to installed (drift from 0.19.0)
bd = "1.3.0"               # beads — pinned GitHub release download (no versioned homebrew-core formula)
ah = "0.12.0"              # espectacular (bin: ah) — was unpinned; realigned to installed
