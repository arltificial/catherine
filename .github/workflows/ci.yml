# CI gate for catherine (beads catherine-6p5).
#
# Pins come from versions.ddl.toml (Standardization §4) via
# scripts/ci-install.sh — never `latest`. The bd-export freshness gate is
# NOT a workflow step: bd export reads bd's dolt database and CI never runs
# dolt (no-db invariant), so freshness is asserted by the
# standard_conformance test inside `cargo test --workspace` (the `just ci`
# step below).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (rustup) + fmt/clippy components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install pinned ecosystem tools (versions.ddl.toml)
        run: scripts/ci-install.sh

      - name: Install just (gate runner)
        run: cargo install just --version 1.59.0

      - name: Gate — pretender complexity, fail-closed full tree (no baseline)
        # The local pre-commit hook runs the same command outside the
        # ddl-managed block (lefthook.yml pretender-strict); this step makes
        # `--no-verify` commits fail too. 0.2s, no baseline permitted.
        run: pretender check --mode gate

      - name: Gate — fmt / clippy -D warnings / tests (incl. conformance)
        run: just ci

      - name: Gate — wasm32 compile-only, kernel stays wasm-optional (add-wasm-web-view task 4)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p catherine-wasm --target wasm32-unknown-unknown

      - name: Install pinned Lean toolchain (elan 4.2.4; lean/lean-toolchain)
        # `--default-toolchain none` keeps the runner free of a floating
        # default: the committed `lean/lean-toolchain` (v4.36.0) is the only
        # pin, and `lake` fetches exactly that version on first use.
        # The installer itself is pinned to the elan v4.2.4 release tag (the
        # version provisioned locally), not the moving `master` branch, and
        # is downloaded to a file before execution: with `set -euo pipefail`
        # a failed download fails THIS step, rather than vanishing into a
        # `curl | sh` pipeline and resurfacing later as "lake not found".
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/elan-init.sh \
            https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Gate — Lean twin build, parity oracle, axiom audit (add-lean-kernel-model task 11)
        run: just lean

      - name: Gate — openspec validate, all changes, strict
        run: openspec validate --changes --strict --no-interactive

      - name: Gate — ah check (spec-test correspondence)
        run: ah check
