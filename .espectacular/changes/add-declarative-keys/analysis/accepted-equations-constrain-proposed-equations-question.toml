id = "accepted-equations-constrain-proposed-equations-question"
description = "Bounded search judges satisfiability by the accepted constraints only (equations and keys): a candidate the accepted constraints admit is clean even when it fails a proposed equation or key, the failure surfaces as a hypothesized finding, and a proposed-constraint violation never blocks a witness or turns the outcome into a contradiction."
archetype = "PF"
status = "active"
superseded_by = ""
authored_with = "0.12.0"

[tests]
cargo = [
    { flags = "is_clean_accepts_accepted_clean_proposed_dirty" },
    { flags = "search_returns_witness_despite_proposed_violations" },
    { flags = "proposed_key_does_not_block_search_cleanliness" },
]