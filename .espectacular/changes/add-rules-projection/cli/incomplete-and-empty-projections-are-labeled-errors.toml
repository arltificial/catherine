id = "incomplete-and-empty-projections-are-labeled-errors"
description = "A projection whose column or action cell is null fails with the labeled `projection_incomplete` code naming row and arrow, and a projected object with no rows fails with `empty_projection` — both under the build-failure exit class, never a silent skip or a vacuous clean run."
